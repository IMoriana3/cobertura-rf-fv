# EL VIGIA DE LOS LAYOUTS, y por que va SOLO y no en `bancos.yml`.
#
# La implantación de una planta se procesa UNA vez, en `cobertura-zigbee`, y
# aquí se trae. `tests/test_procedencia.js` —que sí corre en cada PR—
# vigila que nadie edite una copia a mano, pero no puede ver lo otro: que el
# repo de origen AVANCE y aquí nos quedemos atrás. Para eso hay que salir a la
# red, y un banco que depende de que GitHub conteste no puede estar en la puerta
# de una PR: bloquearía un merge por un corte que no tiene nada que ver con el
# cambio. Así que va aparte, semanal, y avisa sin bloquear a nadie.
#
# Cuando se ponga rojo, el arreglo es una línea:
#     python3 tools/sincroniza_desde_zigbee.py
# y commitear lo que traiga (incluido `plantas/PROCEDENCIA.json`).
name: layouts al día

on:
  schedule:
    # lunes a las 6:00 UTC: el rojo está puesto al empezar la semana, no el viernes
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  al_dia:
    name: ¿siguen siendo los de cobertura-zigbee?
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      # `--ver` no escribe nada y sale en rojo si hay algo que traer.
      - name: comparar con el origen
        run: python3 tools/sincroniza_desde_zigbee.py --ver
