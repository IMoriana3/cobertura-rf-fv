# LOS BANCOS, SOLOS.
#
# Hasta ahora se corrían a mano y tardan veinte minutos entre todos: en la
# práctica eso significa que un cambio se podía mergear sin que nadie los
# hubiera pasado. Cinco defectos visibles llegaron a producción por ese hueco.
#
# CÓMO ESTÁ MONTADO, y por qué así:
#
#   · Chromium PINCHADO por la versión de `playwright` (1.62.1). El paquete npm
#     fija el binario del navegador, así que el runner dibuja con el MISMO que
#     generó las imágenes de referencia. Sin ese pin, una actualización de
#     Chromium rompería la prueba de imagen sin que nada del repo cambiara.
#   · Cada banco en su propio job y `fail-fast: false`: si falla el de imagen se
#     quiere saber igualmente si el del visor pasa. Y corren en paralelo.
#   · El de imagen SUBE lo que ha visto cuando falla (la vista de ahora y el
#     diff), que es lo único que hace accionable un fallo de píxeles.
#
# LO QUE NO SE PUEDE PROMETER DESDE FUERA. El dibujo lo hace SwiftShader por
# software, y despacha según las instrucciones del procesador: la misma escena
# en otra máquina puede mover píxeles de borde. Por eso la prueba de imagen
# decide por BLOQUES de 8x8 (medido: el ruido propio es 0,056 % de bloques y un
# defecto real mueve entre el 19 y el 32 %), y por eso existe el botón de
# abajo: si el runner no casa con las referencias, se regeneran EN EL RUNNER y
# se bajan del artefacto para commitearlas.
name: bancos

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      actualizar_imagenes:
        description: 'Regenerar las imágenes de referencia EN EL RUNNER y subirlas como artefacto (luego hay que MIRARLAS y commitearlas)'
        type: boolean
        default: false

# No acumular ejecuciones sobre la misma rama: la última es la que importa.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PLAYWRIGHT_VERSION: 1.62.1
  PNGJS_VERSION: 7.0.0

jobs:
  # El núcleo físico y la PARIDAD entre el .py y su port JS. Segundos, sin
  # navegador: si esto falla, lo demás da igual.
  nucleo:
    name: núcleo + paridad py/js
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python3 tests/test_nucleo.py
      # No abre navegador ni pide red: es aritmetica sobre dos ficheros del
      # repo, asi que va aqui y tarda menos de un segundo.
      - name: el DEM contra los levantamientos (Ayora y San José)
        run: node tests/test_careo_dem.js
      # La implantación es UNA y vive en `cobertura-zigbee`. Esto vigila que las
      # copias de `plantas/` sigan siendo las que trajo la sincronización: sin
      # red, sobre ficheros del repo, y con su mutación dentro.
      - name: layouts y módulos siguen siendo los de cobertura-zigbee
        run: node tests/test_procedencia.js
      # Y que la sincronización no pueda GRABAR UNA MENTIRA. PROCEDENCIA dice
      # «rama: main» sin preguntar, así que sincronizar desde una rama de trabajo
      # anota un commit que no está publicado: correcto el día que se escribe, y
      # apuntando al vacío en cuanto la rama se rebasa. Pasó de verdad (se anotó
      # 8ef77ba, de una rama; el contenido coincidía con main hash a hash, la
      # referencia no llevaba a ningún sitio). El banco monta repositorios de usar
      # y tirar, no toca la red, y lleva su mutación dentro.
      - name: el sincronizador se niega a anotar un commit sin publicar
        run: python3 tests/test_sincronizador.py
      # La zona de cada NCU es aritmetica sobre el layout, asi que se comprueba
      # aqui y en milisegundos. SON DOS MITADES: que contenga a los suyos (la
      # facil, se cumple por construccion) y que NO se trague a los ajenos. Yo
      # solo habia escrito la primera, y por eso una envolvente que se comia el
      # campo de la NCU de al lado salia verde -- 79 seguidores ajenos dentro en
      # San Jose, 7 en Polvorin, 6 en Paramo. Se vio mirando la pantalla, que es
      # como no se deben encontrar los defectos.
      - name: la zona de cada NCU dice la verdad (las dos mitades)
        run: node tests/test_zonas_ncu.js
      # Y SUS DOS MUTACIONES, una por mitad. Antes estaban escritas pero NADIE
      # LAS CORRIA: una mutacion que no se ejecuta se pudre igual que un banco
      # que no se ejecuta, y de hecho la segunda no existia. rc = 0 es «la caza».
      - name: y sus dos mutaciones, en rojo
        run: |
          set +e
          for m in ZONAS_PUNTO ZONAS_SIN_PARTIR; do
            env "$m=si" node tests/test_zonas_ncu.js > /tmp/zon_$m.log 2>&1
            rc=$?
            if [ "$rc" != "0" ]; then
              echo "la mutacion $m NO la caza el banco (rc=$rc)"; tail -20 /tmp/zon_$m.log; exit 1
            fi
            echo "$m: cazada"
          done

      # LAS COPIAS DEL CANON DE RADIO, CAREADAS CONTRA SU ORIGINAL. `radio_pv_model`
      # vive en `siting`; aquí hay copia porque el visor es un HTML de Pages y no
      # puede leer un repo hermano en tiempo de ejecución. Una copia sin quien la
      # caree se queda vieja EN SILENCIO: le pasó a SolarGPTfull, dos meses por
      # detrás y 4,8 dB de diferencia sin que nadie lo supiera. El candado por
      # sha256 SOLO no arregla eso —cuadra consigo mismo— así que el banco trae el
      # original: clon al lado si lo hay, y si no `--depth 1` (siting es PÚBLICO).
      # Sin red y sin clon sale con rc = 2, no con 0.
      - name: las copias del canon de radio siguen siendo el canon
        run: python3 tests/test_canon_pin.py

      # La vista en planta: QUÉ obstáculos ve cada enlace. Sin navegador —extrae
      # el bloque CAMPO del HTML real a un `vm`— así que cuesta un segundo y va
      # aquí. LLEVABA EN EL REPO SIN CORRER EN NINGÚN SITIO: daba 33 de 33, pero
      # por suerte, no por vigilancia. Lo encontró el censo de abajo.
      - name: la vista en planta ve los obstáculos que debe
        run: node tests/test_demo_cobertura.js

      # Y EL CENSO, para que eso no vuelva: cada `tests/test_*` del disco tiene
      # que salir en algún workflow. Mira la DECLARACIÓN, no la corrida —de la
      # corrida se ocupa `ci_al_dia.sh` de proyectos— y se cuenta a sí mismo.
      - name: ningún banco de este repo se queda sin correr
        run: python3 tests/test_censo_bancos.py

  # Los tres bancos de navegador. Cada uno tarda entre cinco y quince minutos
  # dibujando por software, así que van en paralelo.

      # EL ENLACE A LA GUÍA DE PUERTAS, COMPROBADO. Un enlace roto al documento
      # que dice «una puerta verde afirma dos cosas» sería el chiste final.
      # Resuelve el fichero en el clon de `proyectos` que haya al lado —el del
      # PIN si este repo lo fija— y si no hay, lo trae con --depth 1 (es
      # público). Sin red y sin clon sale con rc = 2, no con 0.
      - name: el enlace a la guía de puertas apunta a algo que existe
        run: bash docs/enlace_guia.sh

  navegador:
    name: ${{ matrix.nombre }}
    runs-on: ubuntu-latest
    # UN TOPE POR BANCO, MEDIDO. Los tres tardan cosas muy distintas y un tope
    # unico solo puede ser el del mas lento, que es no vigilar a los otros dos.
    #
    #   banco             aqui     en el runner     tope
    #   visor 3D           ~90 s      4 min          30
    #   imagen            ~17 min    19 min          45
    #   plantas reales    626 s      >45 min (!)     90
    #
    # `plantas reales` se comio los 45 minutos y el tope lo CORTO —hizo justo su
    # trabajo—. No es un cuelgue: el banco hace 19 construcciones de planta y sus
    # comprobaciones son el 91 % del tiempo (las cargas son 55 s de 626), asi que
    # el presupuesto estaba corto, no el banco desbocado. Se sube a 90 con la
    # medida delante.
    #
    # Y queda dicho lo que toca de verdad: este banco ha crecido hasta hacer el
    # trabajo de tres y deberia PARTIRSE en varias entradas de esta matriz. Subir
    # el tope compra tiempo; partirlo es el arreglo.
    timeout-minutes: ${{ matrix.tope }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { banco: test_visor_3d.js,       nombre: 'visor 3D',                      tope: 30 }
          # La hora es la variable que se toca todo el rato y estaba como un
          # deslizador mas entre diez. Al subirla a su propia fila, el riesgo es
          # dejar el ▶ mudo: su manejador vivia dentro del grupo del que se
          # saca. Asi que el banco lo PULSA y mira si el reloj avanza.
          - { banco: test_fila_tiempo.js,    nombre: 'la hora, en su fila',           tope: 20 }
          # La ortofoto es lo unico de esta pagina que sale a pedir imagenes, asi
          # que el banco las SIRVE el (un damero conocido) y comprueba lo que
          # importa: que la foto llegue AL SUELO —textura, UV y pixeles— y que
          # cuando no se puede bajar, la pagina lo DIGA y vuelva a las curvas.
          - { banco: test_ortofoto.js,       nombre: 'ortofoto del terreno',          tope: 20 }
          - { banco: test_imagen.js,         nombre: 'imagen (vistas de referencia)', tope: 45 }
          # `plantas reales` ya no es UN job: hacía el trabajo de tres y se comió
          # los 45 minutos. Ahora son cuatro grupos en paralelo, y un rojo dice
          # QUÉ parte se rompió sin abrir el log. Medido aquí:
          #   chicas 13 s · grandes 42 s · reparto 73 s · relieve 23 s
          # Sumados, 151 s — contra 541 s del banco entero: la misma faena cuesta
          # 3,6 veces menos repartida, porque una sola sesión encadena 19 cargas
          # de planta y se degrada. Topes con el factor 5 del runner y holgura.
          - { banco: test_bifila_plantas.js, nombre: 'plantas · chicas',  grupo: plantas-chicas,  tope: 20 }
          - { banco: test_bifila_plantas.js, nombre: 'plantas · grandes', grupo: plantas-grandes, tope: 25 }
          - { banco: test_bifila_plantas.js, nombre: 'plantas · reparto', grupo: reparto,         tope: 30 }
          - { banco: test_bifila_plantas.js, nombre: 'plantas · relieve', grupo: relieve,         tope: 20 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      # `--no-save` a propósito: este repo NO lleva package.json (la página no
      # depende de nada; las dependencias son solo de los bancos) y las
      # versiones se fijan aquí arriba, a la vista.
      - name: dependencias de los bancos
        run: npm install --no-save --no-audit --no-fund
             playwright@${{ env.PLAYWRIGHT_VERSION }} pngjs@${{ env.PNGJS_VERSION }}

      - name: cache del navegador
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}

      - name: Chromium
        run: npx playwright install --with-deps chromium

      # La página se sirve por HTTP: con doble clic (file://) los layouts y el
      # CAD no llegan, que es justo lo que los bancos vienen a comprobar.
      - name: servidor estático
        run: |
          python3 -m http.server 8099 >/dev/null 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:8099/index.html && break; sleep 1; done
          curl -sf -o /dev/null http://127.0.0.1:8099/index.html

      - name: ${{ matrix.nombre }}
        env:
          SALIDA: ${{ github.workspace }}/salida-imagen
        run: |
          if [ "${{ inputs.actualizar_imagenes }}" = "true" ] && [ "${{ matrix.banco }}" = "test_imagen.js" ]; then
            node tests/${{ matrix.banco }} --actualizar
          else
            # `matrix.grupo` va vacío en los bancos que no se parten, y el banco
            # lo lee como «todo». Un grupo mal escrito NO pasa en verde: aborta
            # con la lista de los que hay, y además el banco exige haber corrido
            # alguna comprobación — el fallo más caro es el banco que no mira.
            node tests/${{ matrix.banco }} ${{ matrix.grupo }}
          fi

      # Un fallo de píxeles sin la imagen es un número que no dice nada.
      - name: qué se vio (cuando la imagen no casa)
        if: failure() && matrix.banco == 'test_imagen.js'
        uses: actions/upload-artifact@v4
        with:
          name: imagen-que-no-casa
          path: salida-imagen/
          if-no-files-found: warn

      # Referencias regeneradas en el runner, para bajarlas y commitearlas
      # DESPUÉS DE MIRARLAS. Nunca se commitean solas.
      - name: referencias regeneradas
        if: always() && inputs.actualizar_imagenes && matrix.banco == 'test_imagen.js'
        uses: actions/upload-artifact@v4
        with:
          name: referencias-del-runner
          path: tests/ref/

  # ── LA PUERTA ─────────────────────────────────────────────────────────────
  # Un solo check que resume a todos, para que la proteccion de rama tenga UNA
  # casilla que marcar en vez de siete.
  #
  # Marcar las siete a mano parece equivalente y no lo es: el dia que se
  # renombre una entrada de la matriz —hoy mismo `plantas reales` se convirtio
  # en cuatro— el check con el nombre viejo deja de reportar, y una PR se queda
  # bloqueada PARA SIEMPRE esperando algo que ya no existe. Con la puerta, la
  # matriz puede crecer, encogerse o cambiar de nombre sin tocar los ajustes del
  # repositorio.
  #
  # `if: always()` es imprescindible: sin el, la puerta se SALTA cuando algo
  # falla, y un check saltado no es un check rojo — la proteccion lo dejaria
  # pasar. Asi corre siempre y falla diciendo quien cayo.
  #
  # `result` de un job de matriz es success solo si TODAS sus entradas pasaron.
  #
  # ...PERO `always()` A SECAS PINTA ROJOS QUE NO SON. `cancel-in-progress` deja
  # los bancos de la corrida anterior en `cancelled` en cuanto se empuja encima;
  # con `always()` la puerta corre igual, exige `success` y el PR ensena un ROJO
  # donde no ha fallado nada. Paso DOS VECES en la misma PR: el banco de imagen
  # tarda ~19 min y cualquier push dentro de esa ventana se lo lleva por delante.
  # Un rojo que no significa nada ensena a no mirar los rojos, que es el coste
  # de verdad.
  #
  # `!cancelled()` lo arregla, y NO abre el agujero contrario. Es la misma
  # condicion que ya usa `cobertura-zigbee`, donde esta medida: sobre sus 40
  # corridas mas recientes, 30 success, 10 cancelled y CERO failure — una de
  # cada cuatro en rojo sin un solo banco caido. Y la objecion obvia (un banco
  # que se CUELGA y lo corta su `timeout-minutes`, ¿se salta la puerta?) esta
  # comprobada alli con un experimento en el runner: `cancelled()` es funcion
  # del WORKFLOW, y un job muerto por su propio tope no la pone cierta — la
  # puerta corre, lee `cancelled` y se queda en ROJO. Lo que se salta es solo la
  # corrida que alguien cancelo de verdad empujando encima.
  #
  # Un `cancelled` por fail-fast de la matriz tambien sigue cayendo: ahi la
  # corrida NO esta cancelada y el job que fallo aparece como `failure`.
  puerta:
    name: bancos en verde
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [nucleo, navegador]
    if: always() && !cancelled()
    steps:
      - name: ninguno ha fallado
        run: |
          echo "nucleo    ${{ needs.nucleo.result }}"
          echo "navegador ${{ needs.navegador.result }}"
          if [ "${{ needs.nucleo.result }}" != "success" ] || [ "${{ needs.navegador.result }}" != "success" ]; then
            echo "::error::hay bancos que no han pasado"
            exit 1
          fi
          echo "todos los bancos en verde"
